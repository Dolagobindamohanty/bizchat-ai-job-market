services:
  - type: web
    name: bizchat-ai-job-market
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BIZCHAT_DATA_PATH
        value: data/raw/jobs-india.csv
      - key: BIZCHAT_FRESHNESS_DAYS
        value: "90"
      - key: JOBMATCH_PROVIDER
        value: openai
      - key: JOBMATCH_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: JOBMATCH_LLM_MODEL
        value: gpt-4.1-mini
      - key: JOBMATCH_AI_DAILY_CALL_LIMIT
        value: "100"
      - key: OPENAI_API_KEY
        sync: false
