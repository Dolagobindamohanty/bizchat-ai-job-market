services:
  - type: web
    name: bizchat-ai-job-market
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BIZCHAT_DATA_PATH
        value: data/raw/jobs-greenhouse-india.csv
