name: Refresh live multi-source jobs

on:
  schedule:
    # Run daily at 06:17 UTC. The workflow_dispatch trigger supports an
    # immediate refresh without waiting for the next scheduled run.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobs-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and validate India snapshot from configured career boards
        run: >-
          python -m collector.cli
          --output data/raw/jobs-india.csv
          --sources-config collector/sources.india.json
          --report data/source-collection-report.json
          --max-posted-age-days 30
          --preserve-uncollected-sources
          --timeout 20

      - name: Verify snapshot is non-empty and deployment-safe
        run: |
          python -m collector.validate --input data/raw/jobs-india.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("data/raw/jobs-india.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          if not rows:
              raise SystemExit("Refusing to publish an empty multi-source snapshot")
          print(f"Validated {len(rows)} live multi-source rows")
          PY

      - name: Publish changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/jobs-india.csv data/source-collection-report.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to publish"
            exit 0
          fi
          git commit -m "chore: refresh live multi-source jobs"
          git push origin HEAD:main
