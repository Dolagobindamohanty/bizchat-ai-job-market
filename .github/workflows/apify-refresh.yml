name: Optional Apify job refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apify-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect official boards and opt-in Apify actors
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: >-
          python -m collector.cli
          --output data/raw/jobs-india.csv
          --sources-config collector/sources.india.json
          --apify-config collector/apify.india.example.json
          --report data/apify-collection-report.json
          --max-posted-age-days 30
          --timeout 30
          --allow-partial

      - name: Validate non-empty snapshot
        run: |
          python -m collector.validate --input data/raw/jobs-india.csv
          test -s data/raw/jobs-india.csv

      - name: Publish changed snapshot and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/jobs-india.csv data/apify-collection-report.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to publish"
            exit 0
          fi
          git commit -m "chore: refresh optional Apify job sources"
          git push origin HEAD:main
